name: Repair PDF.js lockfile

on:
  push:
    branches:
      - chore/project-factory-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/project-factory-foundation

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched PDF.js and refresh lockfile
        run: npm install pdfjs-dist@6.2.108 --save

      - name: Remove one-time repair workflow
        run: rm .github/workflows/repair-pdfjs-lock.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/repair-pdfjs-lock.yml
          git commit -m "fix: upgrade pdfjs-dist to patched 6.2.108"
          git push origin HEAD:chore/project-factory-foundation
